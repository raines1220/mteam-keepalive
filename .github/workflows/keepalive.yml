name: M-Team keepalive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mteam-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check required secrets
        env:
          USERNAME: ${{ secrets.MT_USERNAME }}
          PASSWORD: ${{ secrets.MT_PASSWORD }}
          TOTPSECRET: ${{ secrets.MT_TOTPSECRET }}
        run: |
          python - <<'PY'
          import os
          import sys
          missing = [name for name in ('USERNAME', 'PASSWORD', 'TOTPSECRET') if not os.environ.get(name)]
          if missing:
              print('Missing required credentials: ' + ', '.join(missing))
              sys.exit(1)
          PY

      - name: Refresh last browse time
        env:
          USERNAME: ${{ secrets.MT_USERNAME }}
          PASSWORD: ${{ secrets.MT_PASSWORD }}
          TOTPSECRET: ${{ secrets.MT_TOTPSECRET }}
          DB_PATH: ${{ runner.temp }}/mteam/cookie.db
          TIME_OUT: '20'
        run: python mtlogin.py --skip-cache

      - name: Remove local token database
        if: always()
        run: rm -rf -- "${{ runner.temp }}/mteam"
